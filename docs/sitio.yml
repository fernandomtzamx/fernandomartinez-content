# Configuración del sitio. Se aplica con scripts/site_setup.py
# (Actions > Publicar en WordPress > Run workflow > setup, o en cada push que cambie este archivo).

ajustes:
  title: "Fernando Martínez"
  description: "Director de tecnología, programador desde 2008 y marketero en recuperación"
  timezone: "America/Mexico_City"
  date_format: "j \\d\\e F \\d\\e Y"
  posts_per_page: 12
  default_comment_status: closed
  default_ping_status: closed
  portada: inicio        # slug de la página de inicio
  pagina_blog: blog      # slug de la página que lista las entradas

autor:
  first_name: "Fernando"
  last_name: "Martínez"
  name: "Fernando Martínez"
  nickname: "Fernando"
  url: "https://www.linkedin.com/in/fernandomtza/"
  description: "CTO en EngineCX, ingeniero en computación por la UNAM y programador desde 2008. Escribe sobre IA aplicada, CRM, Martech, la industria automotriz y opiniones que no caben en LinkedIn."

categorias:
  - slug: ia-y-tecnologia
    name: IA y tecnología
    description: "Inteligencia artificial, automatización y tecnologías que prometieron mucho (y lo que de verdad cumplieron)."
  - slug: marketing
    name: Marketing
    description: "Inbound, contenido, redes y marca, medidos en ventas y no en aplausos."
  - slug: crm-y-datos
    name: CRM y datos
    description: "Clientes, bases de datos, buyer personas y cómo convertir información en decisiones."
  - slug: automotriz
    name: Automotriz
    description: "Venta de autos, financiamiento, posventa y experiencia del cliente en la industria automotriz."
  - slug: desarrollo-web
    name: Desarrollo web
    description: "Joomla, WordPress, Shopify, velocidad y lo que aprendí programando más de 200 sitios."
  - slug: ventas-y-liderazgo
    name: Ventas y liderazgo
    description: "Equipos comerciales, compensación y hábitos de la gente que hace que las cosas pasen."
  - slug: opinion
    name: Opinión
    description: "Ideas personales sobre sociedad, causas y conversación pública. Firmadas, discutibles."

menu:
  - {label: "Quién soy", url: "/fernando-arturo-martinez-aguilar/"}
  - {label: "Cómo te ayudo", url: "/como-te-ayudo/"}
  - {label: "Blog", url: "/blog/"}
  - {label: "Recursos", url: "/recursos/"}
  - {label: "Contacto", url: "/contacto/"}

blog:
  titulo: "Notas de un CTO que todavía escribe código"
  intro: "IA aplicada, CRM, Martech, la industria automotriz y opiniones que no caben en LinkedIn. Las entradas del blog original, reescritas y puestas al día en 2026."

# Archivos de marca (assets/marca). Se suben a la biblioteca de medios y se fijan como logo e ícono.
marca:
  logo: assets/marca/fernando-martinez-logo.png
  logo_blanco: assets/marca/fernando-martinez-logo-blanco.png
  icono: assets/marca/fernando-martinez-icono.png
  boton: {label: "Platiquemos", url: "/contacto/"}

# Anchos de lectura: columna de texto y bloques anchos.
layout:
  contentSize: "720px"
  wideSize: "1200px"

# CSS adicional del sitio (estilos globales). Las portadas son 1200x630: sin recorte.
css: |
  body{-webkit-font-smoothing:antialiased}
  ::selection{background:var(--wp--preset--color--accent-3);color:#fff}
  .wp-site-blocks>header.wp-block-template-part{position:sticky;top:0;z-index:50}
  .admin-bar .wp-site-blocks>header.wp-block-template-part{top:32px}
  @media (max-width:782px){.admin-bar .wp-site-blocks>header.wp-block-template-part{top:46px}}
  .fm-header{background:#fff;border-bottom:1px solid var(--wp--preset--color--accent-2)}
  .fm-header .wp-block-navigation__responsive-container.is-menu-open{z-index:100000;padding:var(--wp--preset--spacing--50)}
  .fm-header .wp-block-navigation__responsive-container.is-menu-open .wp-block-navigation-item__content{font-size:1.4rem;font-weight:700;padding:.35em 0}
  .fm-header .wp-block-site-logo img{height:auto}
  .fm-header .wp-block-navigation a{font-weight:600;text-decoration:none}
  .fm-header .wp-block-navigation a:hover{color:var(--wp--preset--color--accent-3)}
  .fm-header .wp-block-button__link{padding:.6em 1.3em;font-size:.92rem}
  @media (max-width:600px){.fm-header .fm-header-cta{display:none}}
  .wp-block-post-featured-image img{aspect-ratio:1200/630!important;object-fit:cover!important;height:auto!important;width:100%!important}
  .wp-block-post-template>li{transition:transform .2s ease}
  .wp-block-post-template>li:hover{transform:translateY(-3px)}
  .wp-block-post-template .wp-block-post-featured-image img{border-radius:14px;box-shadow:0 1px 2px rgba(60,60,59,.08),0 8px 24px rgba(60,60,59,.08)}
  .wp-block-post-template .wp-block-post-title{margin-top:.5em;line-height:1.25}
  .wp-block-post-template .wp-block-post-title a{text-decoration:none;color:var(--wp--preset--color--contrast)}
  .wp-block-post-template .wp-block-post-title a:hover{color:var(--wp--preset--color--accent-3)}
  .wp-block-post-terms a{color:var(--wp--preset--color--accent-3);text-decoration:none;text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:.78em}
  .fm-meta{color:var(--wp--preset--color--accent-4);font-size:.9rem}
  .fm-meta a{color:inherit;font-weight:700;text-decoration:none}
  .fm-meta .wp-block-post-terms a{font-size:1em;letter-spacing:.06em}
  .fm-sep{opacity:.4}
  .single .wp-block-post-featured-image img{border-radius:18px}
  .wp-block-post-navigation-link{font-weight:700}
  .wp-block-post-navigation-link a{text-decoration:none;color:var(--wp--preset--color--contrast)}
  .wp-block-post-navigation-link a:hover{color:var(--wp--preset--color--accent-3)}
  .wp-block-post-navigation-link .post-navigation-link__label{display:block;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--wp--preset--color--accent-4);font-weight:700;margin-bottom:.3em}
  .fm-kicker-llaves{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.8rem;color:var(--wp--preset--color--accent-3)}
  .fm-footer a{text-decoration:none}
  .fm-footer .fm-kicker-llaves{color:#ff9aa0}
  .fm-footer a:hover{color:var(--wp--preset--color--accent-3)!important}
  .wp-block-query-pagination a{text-decoration:none;font-weight:700}

# Colores de marca sobre la paleta de Twenty Twenty-Five (mismos slugs del tema).
# Tomados del logo: gris #3C3C3B y rojo #E20613.
paleta:
  base: "#FFFFFF"        # fondo
  contrast: "#3C3C3B"    # gris del logo: texto y títulos
  accent-1: "#FDECEC"    # rojo muy claro: llamados a la acción y resaltados
  accent-2: "#ECECEB"    # líneas y bordes
  accent-3: "#E20613"    # rojo de la corbata
  accent-4: "#6E6E6C"    # gris medio: fechas, categorías, notas
  accent-5: "#F6F6F5"    # gris de sección

# Ejemplos de WordPress y pruebas: a la papelera (recuperables en wp-admin).
borrar:
  - {id: 1, slug: hello-world, tipo: posts}
  - {id: 6, slug: prueba-conexion-agente, tipo: posts}
  - {id: 2, slug: sample-page}
