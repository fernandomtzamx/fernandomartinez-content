name: Capturas del sitio

on:
  push:
    branches: [main]
    paths:
      - "scripts/screenshots.py"
      - ".github/workflows/capturas.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Publicar en WordPress"]
    types: [completed]

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    env:
      WP_URL: ${{ secrets.WP_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q playwright requests && python -m playwright install --with-deps chromium > /dev/null
      - run: python scripts/screenshots.py
      - name: Guardar capturas
        run: |
          git config user.name "fm-bot"
          git config user.email "fm-bot@users.noreply.github.com"
          git add registro/capturas
          git commit -m "Capturas del sitio [skip ci]" || exit 0
          git pull --rebase -q origin main && git push -q origin HEAD:main
